Name=Time compression extras
Description=Raises the time compression cap (500x); combat slowdown (20x near munitions, aircraft near hostile ships and guns; torpedoes within 10 nm) that only reacts to what you can see; fixes ASROC / SS-N-16 / RBU speed jumps and unstable bomb steering when compression changes; above 30x skips carrier launches and landings (campaign-safe) with a configurable gap between aircraft; adaptive simulation step; sonobuoys and helicopter dipping sonar that no longer circle their point forever at high speed. Settings in MainMod.cfg.

